name: Fix Acquired edit photo state

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.issue.title == 'fix-acquired-edit-photo-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist replacement photo state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '  editFocal: { x: 50, y: 50 },\n  editFocalFor: null,\n  imageUrls: {},',
              '  editFocal: { x: 50, y: 50 },\n  editFocalFor: null,\n  editFile: null,\n  editFilePreview: null,\n  editFileFor: null,\n  imageUrls: {},',
          )

          replace_once(
              '  if (route === "/accession") { state.accessionVisibility = "private"; state.editVisibilityFor = null; }\n  window.location.hash = routeToHash(route, params);',
              '  if (route === "/accession") { state.accessionVisibility = "private"; state.editVisibilityFor = null; }\n  if (route !== "/edit") { state.editFile = null; state.editFilePreview = null; state.editFileFor = null; }\n  window.location.hash = routeToHash(route, params);',
          )

          replace_once(
              '  const focal = state.editFocal;\n  const existingImage = (o.object_images || []).sort((a,b) => (a.position||0)-(b.position||0))[0];\n  let newFile = null, newPreview = null;',
              '  const focal = state.editFocal;\n  const existingImage = (o.object_images || []).sort((a,b) => (a.position||0)-(b.position||0))[0];\n  if (state.editFileFor !== o.id) {\n    state.editFile = null;\n    state.editFilePreview = null;\n    state.editFileFor = o.id;\n  }',
          )

          replace_once('      newFile = file;', '      state.editFile = file;')
          replace_once(
              '      reader.onload = ev => { newPreview = ev.target.result; render(); };',
              '      reader.onload = ev => { state.editFilePreview = ev.target.result; render(); };',
          )
          replace_once(
              '    el("img", { src: newPreview || (existingImage ? imageUrl(existingImage.storage_path) : "") }),\n    newPreview ? "New photograph selected" : "Tap to replace photograph",',
              '    el("img", { src: state.editFilePreview || (existingImage ? imageUrl(existingImage.storage_path) : "") }),\n    state.editFilePreview ? "New photograph selected" : "Tap to replace photograph",',
          )
          replace_once(
              '  const cropSrc = newPreview || (existingImage ? imageUrl(existingImage.storage_path) : null);',
              '  const cropSrc = state.editFilePreview || (existingImage ? imageUrl(existingImage.storage_path) : null);',
          )
          replace_once('      let sourceFile = newFile;', '      let sourceFile = state.editFile;')
          replace_once(
              '      newFile = new File([outBlob], "photo.png", { type: "image/png" });\n      const url = URL.createObjectURL(outBlob);\n      newPreview = url;',
              '      state.editFile = new File([outBlob], "photo.png", { type: "image/png" });\n      const url = URL.createObjectURL(outBlob);\n      state.editFilePreview = url;',
          )
          replace_once('      if (newFile) {', '      if (state.editFile) {')
          replace_once(
              '        const { error: upErr } = await sb.storage.from(IMAGE_BUCKET).upload(path, newFile, { upsert: true });',
              '        const { error: upErr } = await sb.storage.from(IMAGE_BUCKET).upload(path, state.editFile, { upsert: true });',
          )
          replace_once(
              '      await loadObjects();\n      navigate("/object", { id: o.id });',
              '      state.editFile = null;\n      state.editFilePreview = null;\n      state.editFileFor = null;\n      await loadObjects();\n      navigate("/object", { id: o.id });',
          )

          path.write_text(text)
          PY

          rm .github/workflows/fix-edit-photo-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-edit-photo-state.yml
          git commit -m "Fix replacement photo state in Acquired"
          git push origin HEAD:main
